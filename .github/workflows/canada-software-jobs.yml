name: Canada Software Jobs Monitor

on:
  workflow_dispatch:
    inputs:
      send_initial_snapshot:
        description: "Send current matching jobs on first run"
        required: false
        default: "false"
  schedule:
    - cron: "13 * * * *"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/canada-software-jobs.yml"
      - "job-monitor/**"

permissions:
  contents: read
  actions: write

concurrency:
  group: canada-software-jobs-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AI_FILTER_TOKEN: ${{ secrets.AI_FILTER_TOKEN }}
      AI_FILTER_ENDPOINT: ${{ secrets.AI_FILTER_ENDPOINT }}
      AI_FILTER_MODEL: ${{ secrets.AI_FILTER_MODEL }}
      STATE_FILE: job-monitor/.job_monitor_state.json
    steps:
      - name: Checkout (primary)
        id: checkout_primary
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout fallback (retry without credentials)
        if: steps.checkout_primary.outcome != 'success'
        shell: bash
        run: |
          echo "Primary checkout failed. Falling back to unauthenticated clone with retries."
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

          git init "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          success=0
          for attempt in 1 2 3 4; do
            echo "Fallback fetch attempt ${attempt}..."
            if git fetch --depth=1 origin "${GITHUB_SHA}" && git checkout --detach FETCH_HEAD; then
              success=1
              break
            fi
            sleep $((attempt * 5))
          done

          if [ "${success}" -ne 1 ]; then
            echo "Fallback checkout failed after retries."
            exit 1
          fi

      - name: Restore monitor state
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: canada-software-jobs-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            canada-software-jobs-state-${{ github.ref_name }}-
            canada-software-jobs-state-

      - name: Ensure state directory exists
        shell: bash
        run: |
          mkdir -p "$(dirname "${STATE_FILE}")"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r job-monitor/requirements.txt

      - name: Run monitor once
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.send_initial_snapshot || 'false' }}" = "true" ]; then
            EXTRA="--send-initial-snapshot"
          fi
          python job-monitor/job_monitor.py --config job-monitor/companies.json --state "${STATE_FILE}" --once ${EXTRA}

      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: canada-software-jobs-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
